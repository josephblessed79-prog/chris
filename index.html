<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD Procurement Administration</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="app">
  <div>
    <h1>Ministry of Defence — Procurement Administration</h1>
    <div class="sub">Public Procurement and Disposal of Public Property Act, Act No. 1 of 2015 · Every figure computed, nothing invented · Works entirely on this computer</div>
  </div>
  <div id="statusPill">NO CASE OPEN</div>
</header>

<nav class="tabs" id="tabs">
  <button data-t="start" class="active">Start</button>
  <button data-t="case" disabled>Case Details</button>
  <button data-t="work" disabled>Working Papers</button>
  <button data-t="vote" disabled>Vote &amp; Funding</button>
  <button data-t="fol" disabled>Folios</button>
  <button data-t="ingest" disabled>Import Documents</button>
  <button data-t="ver" disabled>Verification</button>
  <button data-t="docs" disabled>Documents</button>
  <button data-t="settings" disabled>Case File &amp; Register</button>
</nav>

<main>
  <section class="panel show" id="tab-start"></section>
  <section class="panel" id="tab-case"></section>
  <section class="panel" id="tab-work"></section>
  <section class="panel" id="tab-vote"></section>
  <section class="panel" id="tab-fol"></section>
  <section class="panel" id="tab-ingest"></section>
  <section class="panel" id="tab-ver"></section>
  <section class="panel" id="tab-docs"></section>
  <section class="panel" id="tab-settings"></section>
</main>

<div class="footerbar">
  <span id="autosaveNote" class="hint" style="margin-right:auto;align-self:center"></span>
  <button class="btn sec" id="btnSave" disabled>Save Case (.json)</button>
  <button class="btn sec" onclick="document.getElementById('loadFile').click()">Open Case / Old Draft</button>
  <input type="file" id="loadFile" accept=".json" style="display:none">
</div>
