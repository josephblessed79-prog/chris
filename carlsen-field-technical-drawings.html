<style>
:root {
  --bg: #E8E4DB;
  --surface: #F5F3ED;
  --text: #1A1D21;
  --text-2: #5D6670;
  --accent: #0B3D2E;
  --gold: #C4A24F;
  --sidebar-bg: #0B3D2E;
  --sidebar-text: #D6D2C8;
  --sidebar-hover: rgba(255,255,255,0.08);
  --sidebar-active-bg: rgba(196,162,79,0.15);
  --sidebar-active-text: #C4A24F;
  --border: #CCC7BB;
  --sheet-shadow: rgba(0,0,0,0.12);
  --group-label: rgba(255,255,255,0.45);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg: #111318;
    --surface: #1A1D23;
    --text: #DAD7D0;
    --text-2: #8A8680;
    --accent: #2A8C6A;
    --sidebar-bg: #080A0D;
    --sidebar-text: #B0ADA6;
    --sidebar-hover: rgba(255,255,255,0.06);
    --sidebar-active-bg: rgba(196,162,79,0.12);
    --sidebar-active-text: #D4B85F;
    --border: #2A2D32;
    --sheet-shadow: rgba(0,0,0,0.35);
    --group-label: rgba(255,255,255,0.3);
  }
}
:root[data-theme="dark"]{
  --bg: #111318;
  --surface: #1A1D23;
  --text: #DAD7D0;
  --text-2: #8A8680;
  --accent: #2A8C6A;
  --sidebar-bg: #080A0D;
  --sidebar-text: #B0ADA6;
  --sidebar-hover: rgba(255,255,255,0.06);
  --sidebar-active-bg: rgba(196,162,79,0.12);
  --sidebar-active-text: #D4B85F;
  --border: #2A2D32;
  --sheet-shadow: rgba(0,0,0,0.35);
  --group-label: rgba(255,255,255,0.3);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;padding:0;
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  overflow:hidden;height:100vh;
}
.app-header{
  background:var(--sidebar-bg);color:#fff;
  padding:10px 20px;display:flex;align-items:center;gap:16px;
  border-bottom:2px solid var(--gold);
  position:relative;z-index:10;
}
.app-header h1{font-size:15px;font-weight:700;margin:0;letter-spacing:0.04em}
.app-header .sub{color:var(--gold);font-size:12px;font-weight:600;letter-spacing:0.06em}
.menu-btn{
  display:none;background:none;border:1px solid rgba(255,255,255,0.25);
  color:#fff;font-size:18px;padding:4px 10px;border-radius:4px;cursor:pointer;
}
.app-body{display:flex;height:calc(100vh - 46px)}
.sidebar{
  width:230px;min-width:230px;background:var(--sidebar-bg);
  overflow-y:auto;padding:12px 0;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;
}
.grp-label{
  font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--group-label);padding:14px 16px 4px;margin:0;
}
.tab-btn{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--sidebar-text);font:500 12.5px/1.3 'IBM Plex Sans',sans-serif;
  padding:7px 16px 7px 24px;cursor:pointer;transition:background .15s;
}
.tab-btn:hover{background:var(--sidebar-hover)}
.tab-btn.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text)}
.drawing-area{
  flex:1;overflow:auto;padding:24px;
  background:var(--bg);
}
.sheet{
  max-width:1200px;margin:0 auto;
  background:var(--surface);border-radius:4px;
  box-shadow:0 2px 12px var(--sheet-shadow);
  border:1px solid var(--border);
  overflow:hidden;
}
.sheet svg{display:block;width:100%;height:auto}
@media(max-width:740px){
  .menu-btn{display:block}
  .sidebar{
    position:fixed;top:46px;left:0;bottom:0;z-index:20;
    width:260px;transform:translateX(-100%);transition:transform .25s;
  }
  .sidebar.open{transform:translateX(0)}
  .drawing-area{padding:12px}
  .app-header h1{font-size:13px}
}
@media print{
  .sidebar,.app-header,.menu-btn{display:none!important}
  .app-body{height:auto}
  .drawing-area{padding:0;overflow:visible}
  .sheet{box-shadow:none;border:none;border-radius:0;break-inside:avoid}
}
</style>

<text x="610" y="535" text-anchor="middle" font-size="11" font-weight="700" fill="#0B3D2E" font-family="IBM Plex Sans">CUP DESIGN NOTES</text>
<text x="70" y="558" font-size="9" fill="#333" font-family="IBM Plex Sans">1. Generator sized for full Spine + LED + HVAC + Pack cold chain critical load. Wings passive — not on gen backup unless proven necessary.</text>
<text x="70" y="575" font-size="9" fill="#333" font-family="IBM Plex Sans">2. ATS: Automatic Transfer Switch — T&amp;TEC primary, generator backup. Transfer &lt;10s. UPS bridges the gap for PLC/controls/cold chain.</text>
<text x="70" y="592" font-size="9" fill="#333" font-family="IBM Plex Sans">3. Water treatment train sized for WASA supply quality. RO/DI only if incoming TDS exceeds 300 ppm — measure first, don't assume.</text>
<text x="70" y="609" font-size="9" fill="#333" font-family="IBM Plex Sans">4. Nutrient dosing: Separate A/B stocks prevent precipitation. EC target 1.2-2.4 mS/cm crop-dependent, pH 5.5-6.5. All PLC-controlled.</text>
<text x="70" y="626" font-size="9" fill="#333" font-family="IBM Plex Sans">5. Wastewater: All nutrient runoff collected, pH-adjusted, then discharged per EMA Water Pollution Rules 2019. No direct environmental release.</text>
<text x="70" y="643" font-size="9" fill="#333" font-family="IBM Plex Sans">6. Bunding: All chemical/fuel storage fully bunded to 110% volume per OSHA T&amp;T requirements.</text>
<text x="70" y="660" font-size="9" fill="#333" font-family="IBM Plex Sans">7. Solar PV: Rooftop/carport first per Design Rule 5. Grid-tied with net metering if T&amp;TEC approves. Not base case — gate-dependent.</text>

<text x="910" y="457" text-anchor="middle" font-size="8" fill="#333" font-family="IBM Plex Sans">Bay 1 (dispatch) and Bay 2 (receive) are separated — no cross-contamination between incoming inputs and outgoing product.</text>
<text x="910" y="470" text-anchor="middle" font-size="8" fill="#333" font-family="IBM Plex Sans">Loading dock is covered and at truck-bed height (1200mm AFF) for direct pallet transfer.</text>
<!-- Logistics notes -->

<text x="610" y="535" text-anchor="middle" font-size="11" font-weight="700" fill="#0B3D2E" font-family="IBM Plex Sans">LOGISTICS DESIGN NOTES</text>
<text x="70" y="558" font-size="9" fill="#333" font-family="IBM Plex Sans">1. Dispatch and receiving bays are physically separated (Design Rule: Butterfly = flow logic). No backflow of dirty inputs through clean dispatch.</text>
<text x="70" y="575" font-size="9" fill="#333" font-family="IBM Plex Sans">2. Cold chain: Product reaches 4°C within 2 hours of harvest. Cold room sized for 24-hr hold capacity before daily dispatch.</text>
<text x="70" y="592" font-size="9" fill="#333" font-family="IBM Plex Sans">3. Vehicle turning area: 12m depth accommodates a 40ft container truck (12.2m rigid body) with turning radius for 90° back-in.</text>
<text x="70" y="609" font-size="9" fill="#333" font-family="IBM Plex Sans">4. Dock height: 1200mm above finished floor level — matches standard Caribbean truck bed height for direct pallet/crate transfer.</text>
<text x="70" y="626" font-size="9" fill="#333" font-family="IBM Plex Sans">5. Pack house floor: Epoxy-coated concrete, sloped to drain. Wash water collected and routed to CUP wastewater system.</text>
<text x="70" y="643" font-size="9" fill="#333" font-family="IBM Plex Sans">6. Operating hours: Harvest 05:00-08:00 (pre-heat), pack 06:00-14:00, dispatch 12:00-16:00. Schedule avoids peak ambient temperatures.</text>
<text x="70" y="660" font-size="9" fill="#333" font-family="IBM Plex Sans">7. Future: Automated grading/sorting line at scale. Manual at pilot — measure throughput first, then automate what bottlenecks.</text>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const btns = document.querySelectorAll('.tab-btn');
  const sheets = document.querySelectorAll('[id^="s-"]');
  function show(id){
    sheets.forEach(s => s.hidden = s.id !== 's-'+id);
    btns.forEach(b => b.classList.toggle('active', b.dataset.s === id));
    try{localStorage.setItem('cf-td-tab',id)}catch(e){}
    if(window.innerWidth < 740) sidebar.classList.remove('open');
  }
  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.s)));
  menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  try{const saved=localStorage.getItem('cf-td-tab');if(saved&&document.getElementById('s-'+saved))show(saved)}catch(e){}
})();
</script>
